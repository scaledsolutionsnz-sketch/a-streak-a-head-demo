<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Feedback — A Streak A Head</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:#faf7f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
    .card{background:#fff;border-radius:24px;padding:3rem 2.5rem;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(15,13,18,0.1);}
    .logo{font-family:'Raleway',sans-serif;font-size:1.05rem;font-weight:900;color:#0f0d12;margin-bottom:1.5rem;text-align:center;}
    .logo span{color:#c2185b;}
    h1{font-family:'Raleway',sans-serif;font-size:1.45rem;font-weight:900;margin-bottom:0.5rem;}
    .sub{font-size:0.88rem;color:#6b5f6a;margin-bottom:2rem;line-height:1.6;}
    .form-group{margin-bottom:1.1rem;}
    label{display:block;font-size:0.75rem;font-weight:600;color:#6b5f6a;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.4rem;}
    input,select,textarea{width:100%;padding:0.78rem 1rem;border:1.5px solid #f0e4ea;border-radius:10px;font-size:0.9rem;font-family:'Inter',sans-serif;color:#0f0d12;outline:none;transition:border-color 0.2s;appearance:none;}
    input:focus,select:focus,textarea:focus{border-color:#c2185b;}
    textarea{min-height:100px;resize:vertical;}
    .btn{width:100%;padding:0.9rem;background:#c2185b;color:#fff;border:none;border-radius:50px;font-size:0.92rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:background 0.2s;margin-top:0.5rem;}
    .btn:hover{background:#e91e8c;}
    .success{display:none;text-align:center;padding:2rem 0;}
    .success-icon{font-size:3rem;margin-bottom:1rem;}
    .success h2{font-family:'Raleway',sans-serif;font-size:1.35rem;font-weight:900;margin-bottom:0.5rem;}
    .success p{font-size:0.88rem;color:#6b5f6a;}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">A Streak <span>A Head</span></div>
    <div id="formSection">
      <h1>Share your feedback</h1>
      <p class="sub">We're sorry your experience wasn't perfect. Please let us know so we can make it right.</p>
      <form id="feedbackForm" action="https://api.staticforms.xyz/submit" method="post">
        <input type="hidden" name="apiKey" value="sf_768da8d33927e7f4f241d0a6" />
        <div class="form-group"><label>Your Name</label><input type="text" name="firstName" placeholder="Your name" required /></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" placeholder="your@email.com" required /></div>
        <div class="form-group">
          <label>Rating</label>
          <select name="rating" required>
            <option value="" disabled selected>Select your rating</option>
            <option value="1">1 Star — Poor</option>
            <option value="2">2 Stars — Below average</option>
            <option value="3">3 Stars — Good</option>
          </select>
        </div>
        <div class="form-group"><label>Your Feedback</label><textarea name="message" placeholder="What could we have done better?" required></textarea></div>
        <button type="submit" class="btn">Send Feedback →</button>
      </form>
    </div>
    <div class="success" id="successSection">
      <div class="success-icon">💕</div>
      <h2>Thank you for letting us know</h2>
      <p>We appreciate your honesty and will use your feedback to keep improving. We hope to see you again soon.</p>
    </div>
  </div>
  <script>
    const p=new URLSearchParams(window.location.search);
    const r=p.get('rating');
    if(r){const s=document.querySelector('select[name="rating"]');if(s)s.value=r;}
    document.getElementById('feedbackForm').addEventListener('submit',function(e){
      e.preventDefault();
      fetch(this.action,{method:'POST',body:new FormData(this)})
        .then(()=>{document.getElementById('formSection').style.display='none';document.getElementById('successSection').style.display='block';})
        .catch(()=>this.submit());
    });
  </script>
</body>
</html>
